! --- Device: access-switch-sw1 (synthetic example, not a real network) ---
hostname access-switch-sw1

! --- VLANs ---
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MANAGEMENT

! --- Trunk to distribution ---
interface GigabitEthernet1/0/48
 description Trunk to distribution-sw1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 99

! --- User access port with port security ---
interface GigabitEthernet1/0/1
 description User desk 1
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast

! --- Spanning tree ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,99 priority 28672
