! --- Device: branch-router-r2 (synthetic example, not a real network) ---
hostname branch-router-r2

! --- Interfaces ---
interface GigabitEthernet0/0
 description WAN link to core-router-r1
 ip address 10.10.2.2 255.255.255.252
 ip mtu 1500
 no shutdown

interface GigabitEthernet0/1
 description Branch LAN
 ip address 10.30.0.1 255.255.255.0
 no shutdown

! --- OSPF ---
router ospf 1
 router-id 2.2.2.2
 network 10.10.2.0 0.0.0.3 area 0
 network 10.30.0.0 0.0.0.255 area 1
