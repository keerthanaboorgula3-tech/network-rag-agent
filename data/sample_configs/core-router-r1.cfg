! --- Device: core-router-r1 (synthetic example, not a real network) ---
hostname core-router-r1

! --- Interfaces ---
interface GigabitEthernet0/0
 description Uplink to distribution-sw1
 ip address 10.10.1.1 255.255.255.252
 ip mtu 1500
 no shutdown

interface GigabitEthernet0/1
 description WAN link to branch-r2
 ip address 10.10.2.1 255.255.255.252
 ip mtu 1400
 no shutdown

! --- OSPF ---
router ospf 1
 router-id 1.1.1.1
 network 10.10.1.0 0.0.0.3 area 0
 network 10.10.2.0 0.0.0.3 area 0
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1

! --- BGP ---
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 203.0.113.2 remote-as 64500
 neighbor 203.0.113.2 description ISP-A primary
 neighbor 203.0.113.2 timers 10 30
 network 198.51.100.0 mask 255.255.255.0

! --- Access list protecting management ---
ip access-list extended MGMT-IN
 permit tcp 10.20.0.0 0.0.0.255 any eq 22
 deny ip any any log

line vty 0 4
 access-class MGMT-IN in
 transport input ssh
